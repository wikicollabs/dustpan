name: Deploy to Toolforge (Staging)

on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: "Enter deploy passphrase to confirm"
        required: true

permissions:
  contents: read

concurrency:
  group: dustpan-staging-deploy
  cancel-in-progress: false

jobs:
  check-passphrase:
    name: Check deployment authorization
    runs-on: ubuntu-latest

    steps:
      - name: Verify passphrase
        env:
          ENTERED_PASSPHRASE: ${{ inputs.passphrase }}
          EXPECTED_PASSPHRASE: ${{ secrets.DEPLOY_PASSPHRASE_STAGING }}
        run: |
          if [ -z "$EXPECTED_PASSPHRASE" ] ||
             [ "$ENTERED_PASSPHRASE" != "$EXPECTED_PASSPHRASE" ]; then
            echo "Wrong passphrase. Aborting."
            exit 1
          fi

      - name: Verify branch
        env:
          GITHUB_REF_VALUE: ${{ github.ref }}
        run: |
          if [ "$GITHUB_REF_VALUE" != "refs/heads/staging" ]; then
            echo "This workflow must be run from the staging branch."
            exit 1
          fi

  deploy:
    name: Build and deploy
    needs: check-passphrase
    runs-on: ubuntu-latest

    steps:
      - name: Check out staging
        uses: actions/checkout@v5
        with:
          ref: staging

      - name: Show requested commit
        run: |
          git log -1 --oneline
          git rev-parse HEAD

      - name: Set up Toolforge SSH
        env:
          TF_SSH_KEY: ${{ secrets.TF_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$TF_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan login.toolforge.org >> ~/.ssh/known_hosts

      - name: Build and deploy staging
        run: |
          ssh \
            -T \
            -i ~/.ssh/id_ed25519 \
            "${{ vars.TOOLFORGE_USER }}@login.toolforge.org" \
            "become dustpan-staging bash -s" <<'EOF'
          set -euo pipefail

          echo "Building Dustpan staging..."

          toolforge build start \
            https://github.com/wikicollabs/dustpan.git \
            --ref staging \
            --use-latest-versions

          echo "Checking build result..."

          toolforge build show | tee "$HOME/tmp/build-status.txt"

          if ! grep -Eq '^Status: ok([[:space:]]|$|\()' \
            "$HOME/tmp/build-status.txt"; then
            echo "Build did not succeed. Aborting."
            exit 1
          fi

          echo "Restarting staging webservice..."

          toolforge webservice restart

          echo "Checking webservice status..."

          toolforge webservice status

          echo "Staging deployment completed."
          EOF

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## Dustpan staging deployment"
            echo ""
            echo "- Branch: staging"
            echo "- Requested commit: $GITHUB_SHA"
            echo "- Runtime: Toolforge Build Service"
            echo "- Node.js: 26.x (as configured in package.json)"
            echo "- Build: successful"
            echo "- Restart command: completed"
          } >> "$GITHUB_STEP_SUMMARY"