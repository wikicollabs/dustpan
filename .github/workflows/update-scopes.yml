name: Update scope options

on:
  workflow_dispatch:

jobs:
  update-scopes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec tsx src/scripts/updateScopes.ts

      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update scope options cache"
          title: "chore: update scope options cache"
          body: Refreshes src/catalog/scopeOptions.json from current Wikidata values and labels.
          branch: update-scope-options
          base: staging
          delete-branch: true